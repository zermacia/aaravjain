<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jainism Game</title>
<link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet">
<style>
html,body{
  margin:0;
  background:#050000;
  overflow:hidden;
  font-family:'Satoshi', monospace;
}
canvas{display:block}

/* ---------- HUD ---------- */
#header{
  position:fixed;
  top:0; left:0; right:0;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(20,0,0,0.75);
  border-bottom:1px solid rgba(255,80,80,0.35);
  backdrop-filter:blur(6px);
  z-index:10;
}
#timer{ font-size:22px; color:#ff5555; text-shadow:0 0 12px rgba(255,80,80,.6); }
#controls{ font-size:13px; color:#ffcccc; text-shadow:0 0 8px rgba(255,80,80,.4); }
#score{ font-size:15px; color:#ffffff; text-shadow:0 0 10px rgba(255,80,80,.5); }

/* ---------- MENU ---------- */
#menu{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, #140000 0%, #000000 70%);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
}

#menuBox{
  position:relative;
  border:2px solid #ff4444;
  padding:40px 50px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,0,0,.6);
  background:rgba(10,0,0,0.9);
  min-width:320px;
}

#menuBox h1{
  color:#ff5555;
  margin-bottom:25px;
  letter-spacing:2px;
}

.menuBtn{
  display:block;
  width:100%;
  margin:12px 0;
  padding:12px 0;
  background:#120000;
  border:1px solid #ff4444;
  color:#ff7777;
  cursor:pointer;
  font-size:15px;
  transition:0.2s ease;
}

.menuBtn:hover{
  background:#220000;
  box-shadow:0 0 15px rgba(255,0,0,.6);
}

#gameCodeInput{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#0d0000;
  border:1px solid #ff4444;
  color:#ff8888;
  text-align:center;
  font-size:14px;
  outline:none;
}

#gameCodeDisplay{
  margin-top:15px;
  font-size:14px;
  color:#ff9999;
  letter-spacing:2px;
}

#backArrow{
  position:absolute;
  top:18px;
  left:18px;
  font-size:26px;
  color:#ff6666;
  cursor:pointer;
  user-select:none;
  transition:0.2s ease;
}

#backArrow:hover{
  transform:translateX(-4px);
  text-shadow:0 0 12px rgba(255,80,80,.8);
}

/* ---------- END ---------- */
#winner{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:76px;
  color:#ff3333;
  text-shadow:0 0 60px rgba(255,0,0,.85);
  pointer-events:none;
}
#restart{
  position:fixed;
  top:64%;
  left:50%;
  transform:translateX(-50%);
  padding:10px 26px;
  font-size:16px;
  background:#120000;
  border:1px solid #ff4444;
  color:#ff5555;
  cursor:pointer;
  display:none;
  box-shadow:0 0 20px rgba(255,0,0,.6);
}
</style>
</head>
<body>

<div id="menu">
  <div id="menuBox">

    <!-- MAIN MENU -->
    <div id="mainMenu">
      <h1>Jainism Game</h1>
      <button class="menuBtn" onclick="startMode('pvp')">1v1 LOCAL</button>
      <button class="menuBtn" onclick="startMode('ai')">VS COMPUTER</button>
      <button class="menuBtn" id="onlineBtn">ONLINE</button>
    </div>

    <!-- ONLINE MENU -->
    <div id="onlineMenu" style="display:none;">

      <div id="backArrow">&#8592;</div>

      <h1>Online Mode</h1>
      <button class="menuBtn" id="createGameBtn">CREATE GAME</button>
      <input type="text" id="gameCodeInput" placeholder="ENTER GAME CODE">
      <button class="menuBtn" id="joinGameBtn">JOIN GAME</button>

    </div>

    <!-- WAITING SCREEN -->
    <div id="waitingScreen" style="display:none;">
      <h1>Game Code</h1>
      <div id="generatedCode" style="font-size:28px; color:#ff6666; margin-bottom:20px;"></div>
      <div style="color:#ffaaaa;">Waiting for player...</div>
    </div>

  </div>
</div>

<div id="header">
  <div id="timer"></div>
  <div id="controls">AARAV: WASD + F | JAIN: ARROWS + J</div>
  <div id="score"></div>
</div>

<div id="winner"></div>
<button id="restart">RESTART</button>
<canvas id="c"></canvas>

<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

<script>

  const socket = io();

  let currentRoom = null;
  let isOnline = false;
  let isHost = false;
/* ---------- CANVAS ---------- */
const c=document.getElementById("c");
const ctx=c.getContext("2d");
resize(); onresize=resize;
function resize(){ c.width=innerWidth; c.height=innerHeight; }

/* ---------- INPUT ---------- */
const keys={};
onkeydown=e=>keys[e.key]=true;
onkeyup=e=>keys[e.key]=false;

/* ---------- PLAYER ---------- */
function Player(x,y,name,controls,isAI=false){
  return {
    x,y,px:x,py:y,
    name,controls,isAI,
    speed:4.6,
    slowUntil:0,
    lastShot:0,
    // --- AI STATE ---
    aiVirtualX: 0,
    aiVirtualY: 0,
    aiBurstUntil: 0, 
    aiBaiting: false,
    aiWigglePhase: 0
  };
}

let p1,p2,itPlayer;
let mode = null;
let bullets=[];
let gameStart=0,gameOver=false;
let tagCooldownUntil=0;
let glitchUntil=0;
let shakeUntil=0;
let shakeIntensity=0;
let mode=null;

/* ---------- PLAYER IMAGES ---------- */
const playerImages = {
  aarav: {
    safe: new Image(),
    it: new Image()
  },
  jain: {
    safe: new Image(),
    it: new Image()
  }
};

playerImages.aarav.safe.src = "aarav_safe.png";
playerImages.aarav.it.src   = "aarav_it.png";
playerImages.jain.safe.src  = "jain_safe.png";
playerImages.jain.it.src    = "jain_it.png";

const ROUND_TIME=30000;
const scores={aarav:0,jain:0};

/* ---------- PARTICLES ---------- */
const particles=Array.from({length:90},()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  vx:0,vy:0,bx:0,by:0,
  r:2+Math.random()*3
}));
particles.forEach(p=>{p.bx=p.x;p.by=p.y;});

/* ---------- MENU ---------- */
function startMode(m){
  mode=m;
  menu.style.display="none";
  startGame();
}

/* ---------- INIT ---------- */
function startGame(){
  p1=new Player(220,340,"aarav","wasd",false);
  p2=new Player(640,340,"jain","arrows",mode==="ai");
  itPlayer=Math.random()<0.5?p1:p2;
  bullets=[];
  gameStart=performance.now();
  gameOver=false;
  tagCooldownUntil=0;
  glitchUntil=0;
  shakeUntil=0;
  winner.textContent="";
  restart.style.display="none";
}
restart.onclick=startGame;

/* ---------- LOOP ---------- */
function loop(t){
  let sx=0,sy=0;
  if(t<shakeUntil){
    sx=(Math.random()-0.5)*shakeIntensity;
    sy=(Math.random()-0.5)*shakeIntensity;
  }
  ctx.save();
  ctx.translate(sx,sy);

  ctx.fillStyle="#050000";
  ctx.fillRect(0,0,c.width,c.height);

  drawGrid();
  drawParticles();

  if(mode && !gameOver){
    updatePlayer(p1,t);
    p2.isAI ? updateAI(p2,t) : updatePlayer(p2,t);
    updateBullets(t);
    checkTag(t);
    updateTimer(t);
  }

  drawPlayers(t);
  drawScreenRGB(t);

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- PLAYER UPDATE ---------- */
function updatePlayer(p,t){
  p.px=p.x; p.py=p.y;
  let s=t<p.slowUntil?2.6:p.speed;
  let dx=0,dy=0;

  if(p.controls==="wasd"){
    if(keys.w)dy--;
    if(keys.s)dy++;
    if(keys.a)dx--;
    if(keys.d)dx++;
    if(keys.f)shoot(p,t);
    if (isOnline && currentRoom) {
      socket.emit("playerMove", {
        code: currentRoom,
        x: p.x,
      y: p.y
  });
}
  }else{
    if(keys.ArrowUp)dy--;
    if(keys.ArrowDown)dy++;
    if(keys.ArrowLeft)dx--;
    if(keys.ArrowRight)dx++;
    if(keys.j)shoot(p,t);
  }

  p.x+=dx*s;
  p.y+=dy*s;
  p.x=Math.max(20,Math.min(c.width-20,p.x));
  p.y=Math.max(80,Math.min(c.height-20,p.y));
}

/* ---------- AI UPDATE ---------- */
function updateAI(p,t){
  p.px = p.x;
  p.py = p.y;
  let baseSpeed = t < p.slowUntil ? 2.6 : p.speed;
  const target = p === p1 ? p2 : p1;
  const dist = Math.hypot(target.x - p.x, target.y - p.y);
  const isIt = (itPlayer === p);
  let targetDX = 0;
  let targetDY = 0;
  let speedMult = 1.0;

  if (isIt) {
    const px = target.x + (target.x - target.px) * 15;
    const py = target.y + (target.y - target.py) * 15;
    targetDX = px - p.x;
    targetDY = py - p.y;
    p.aiBurstUntil = 0;
    p.aiBaiting = false;
  } 
  else {
    if (t < p.aiBurstUntil) {
       speedMult = 1.4;
       targetDX = p.x - target.x;
       targetDY = p.y - target.y;
    } 
    else {
       if (dist < 200) {
         if (p.aiBaiting) {
           p.aiBurstUntil = t + 800;
           p.aiBaiting = false;
         }
         targetDX = p.x - target.x;
         targetDY = p.y - target.y;
       } 
       else if (dist < 450) {
         p.aiBaiting = true;
         speedMult = 0.2;
         targetDX = p.x - target.x;
         targetDY = p.y - target.y;
       } 
       else {
         p.aiBaiting = false;
         p.aiWigglePhase += 0.2;
         targetDX = Math.sin(p.aiWigglePhase) * 100;
         targetDY = 0;
         speedMult = 0.5;
         if(Math.random()<0.01) shoot(p,t);
       }
    }
    const edgeDist = 120;
    if(p.x < edgeDist) targetDX += 150;
    if(p.x > c.width - edgeDist) targetDX -= 150;
    if(p.y < edgeDist + 80) targetDY += 150;
    if(p.y > c.height - edgeDist) targetDY -= 150;
  }

  const len = Math.hypot(targetDX, targetDY) || 1;
  const nx = targetDX / len;
  const ny = targetDY / len;
  const responsiveness = 0.1;
  p.aiVirtualX += (nx - p.aiVirtualX) * responsiveness;
  p.aiVirtualY += (ny - p.aiVirtualY) * responsiveness;
  p.x += p.aiVirtualX * baseSpeed * speedMult;
  p.y += p.aiVirtualY * baseSpeed * speedMult;
  p.x = Math.max(20, Math.min(c.width - 20, p.x));
  p.y = Math.max(80, Math.min(c.height - 20, p.y));
  if (isIt && dist < 500 && Math.random() < 0.03) shoot(p, t);
}

/* ---------- GAME LOGIC ---------- */
function checkTag(t){
  if(t<tagCooldownUntil) return;
  if(Math.hypot(p1.x-p2.x,p1.y-p2.y)<28){
    itPlayer=itPlayer===p1?p2:p1;
    tagCooldownUntil=t+500;
    glitchUntil=t+150;
    shakeUntil=t+150; shakeIntensity=6;
  }
}

function shoot(p,t){
  if(t-p.lastShot<5000) return;
  p.lastShot=t;
  const target=p===p1?p2:p1;
  let error = p.isAI ? (Math.random() - 0.5) * 0.3 : 0; 
  const a=Math.atan2(target.y-p.y,target.x-p.x) + error;
  bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,owner:p});
}

function updateBullets(t){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy;
    const target=b.owner===p1?p2:p1;
    if(Math.hypot(b.x-target.x,b.y-target.y)<14){
      target.slowUntil=t+3000;
      bullets.splice(i,1);
      continue;
    }
    if(b.x<0||b.y<80||b.x>c.width||b.y>c.height){
      bullets.splice(i,1); continue;
    }
    let g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,6);
    g.addColorStop(0,"#fff");
    g.addColorStop(0.4,"#ff9999");
    g.addColorStop(1,"rgba(255,0,0,0)");
    ctx.fillStyle=g;
    ctx.shadowBlur=14; ctx.shadowColor="#ff5555";
    ctx.beginPath(); ctx.arc(b.x,b.y,6,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
}

function updateTimer(t){
  const left=Math.max(0,ROUND_TIME-(t-gameStart));
  timer.textContent="Time: "+Math.ceil(left/1000);
  if(left<=0 && !gameOver){
    gameOver=true;
    const w=itPlayer===p1?p2:p1;
    scores[w.name]++;
    winner.textContent=w.name.toUpperCase()+" WINS";
    restart.style.display="block";
  }
  score.textContent=`AARAV ${scores.aarav}  |  JAIN ${scores.jain}`;
}

/* ---------- DRAW ---------- */
function drawPlayers(t){
  [p1,p2].forEach(p=>{
    if(!p) return;

    const isIt = (p === itPlayer);
    const baseGlow = isIt ? "#ff3333" : "#ffffff";
    const glow = isIt ? 30 : 14;
    const dx = p.x - p.px;
    const dy = p.y - p.py;

    const imgSet = playerImages[p.name];
    const img = isIt ? imgSet.it : imgSet.safe;

    const baseSize = 72;
    const size = p.name === "aarav" ? baseSize + 8 : baseSize; // image size
    const drawX = p.x - size/2;
    const drawY = p.y - size/2;

    // Arrow (unchanged)
    if(isIt){
      const bounce = Math.sin(t/150)*4;
      ctx.save();
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#ffffff";
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.beginPath();
      ctx.roundRect(p.x - 4, p.y - 70 + bounce, 8, 12, 4);
      ctx.fill();
      ctx.restore();
    }

    // Motion Blur Trails
    for(let i=1;i<=3;i++){
      ctx.globalAlpha = 0.12/i;
      ctx.drawImage(img, drawX - dx*i, drawY - dy*i, size, size);
    }

    ctx.globalAlpha = 1;

    // RGB Glitch
    if(t < glitchUntil){
      ctx.globalAlpha = 0.9;
      ctx.drawImage(img, drawX+2, drawY, size, size);
      ctx.globalAlpha = 0.25;
      ctx.drawImage(img, drawX, drawY, size, size);
      ctx.globalAlpha = 0.6;
      ctx.drawImage(img, drawX-2, drawY, size, size);
      ctx.globalAlpha = 1;
    }else{

  // Increase size slightly
  const baseSize = 72; // overall increase from 64
  const finalSize = p.name === "aarav" ? baseSize + 8 : baseSize;

  const newDrawX = p.x - finalSize/2;
  const newDrawY = p.y - finalSize/2;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  ctx.drawImage(img, newDrawX, newDrawY, finalSize, finalSize);

  ctx.restore();
}
  });
}

function drawRGBText(text,x,y){
  ctx.fillStyle="rgba(255,0,0,0.9)";
  ctx.fillText(text,x+2,y+6);
  ctx.fillStyle="rgba(0,255,0,0.25)";
  ctx.fillText(text,x,y+6);
  ctx.fillStyle="rgba(0,200,255,0.6)";
  ctx.fillText(text,x-2,y+6);
}

function drawScreenRGB(t){
  if(t>glitchUntil) return;
  ctx.globalAlpha=0.06;
  ctx.drawImage(c,2,0);
  ctx.drawImage(c,-2,0);
  ctx.globalAlpha=1;
}

function drawParticles(){
  for(const p of particles){
    let fx=0,fy=0;
    [p1,p2].forEach(pl=>{
      if(!pl) return;
      const dx=p.x-pl.x, dy=p.y-pl.y;
      const d=Math.hypot(dx,dy);
      if(d<140){
        const f=(140-d)/140;
        fx+=dx/d*f*0.5;
        fy+=dy/d*f*0.5;
      }
    });
    p.vx=(p.vx+fx)*0.9;
    p.vy=(p.vy+fy)*0.9;
    p.x+=p.vx; p.y+=p.vy;
    p.x+=(p.bx-p.x)*0.01;
    p.y+=(p.by-p.y)*0.01;
    const glow=Math.min(1,Math.hypot(p.vx,p.vy)*2);
    ctx.fillStyle=`rgba(255,0,0,${0.12+glow*0.25})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r+glow*1.5,0,Math.PI*2);
    ctx.fill();
  }
}

function drawGrid(){
  ctx.strokeStyle="rgba(255,0,0,0.05)";
  for(let x=0;x<c.width;x+=70){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,c.height); ctx.stroke();
  }
  for(let y=80;y<c.height;y+=70){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(c.width,y); ctx.stroke();
  }
}
const mainMenu = document.getElementById("mainMenu");
const onlineMenu = document.getElementById("onlineMenu");
const waitingScreen = document.getElementById("waitingScreen");

const onlineBtn = document.getElementById("onlineBtn");
const backArrow = document.getElementById("backArrow");
const createGameBtn = document.getElementById("createGameBtn");
const joinGameBtn = document.getElementById("joinGameBtn");
const gameCodeInput = document.getElementById("gameCodeInput");
const generatedCode = document.getElementById("generatedCode");

function showMainMenu() {
  mainMenu.style.display = "block";
  onlineMenu.style.display = "none";
  waitingScreen.style.display = "none";
}

function showOnlineMenu() {
  mainMenu.style.display = "none";
  onlineMenu.style.display = "block";
  waitingScreen.style.display = "none";
}

function showWaitingScreen(code) {
  mainMenu.style.display = "none";
  onlineMenu.style.display = "none";
  waitingScreen.style.display = "block";
  generatedCode.textContent = code;
}

onlineBtn.onclick = showOnlineMenu;
backArrow.onclick = showMainMenu;

createGameBtn.onclick = () => {
  const code = Math.floor(10000 + Math.random() * 90000).toString();
  currentRoom = code;
  isOnline = true;
  isHost = true;

  socket.emit("createRoom", code);

  showWaitingScreen(code);
};

joinGameBtn.onclick = () => {
  const code = gameCodeInput.value.trim();
  if (code.length === 5) {
    currentRoom = code;
    isOnline = true;
    isHost = false;

    socket.emit("joinRoom", code);

    showWaitingScreen(code);
  }
};
socket.on("startGame", () => {
  mode = "online";        // set mode manually
  document.getElementById("menu").style.display = "none";
  startGame();            // directly start game
});
socket.on("opponentMove", (data) => {
  if (!p1 || !p2) return;

  if (isHost) {
    p2.x = data.x;
    p2.y = data.y;
  } else {
    p1.x = data.x;
    p1.y = data.y;
  }
});
</script>
</body>
</html>
